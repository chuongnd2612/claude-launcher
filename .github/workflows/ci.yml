name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        shell: pwsh
        # No --source override needed: the project has zero NuGet dependencies,
        # so the framework-dependent build restores entirely offline.
        run: dotnet build src/ClaudeLauncher.csproj -c Release --nologo -warnaserror

      - name: Render every screen (layout smoke test)
        shell: pwsh
        run: |
          $stateDir = Join-Path $env:RUNNER_TEMP 'launcher'
          New-Item -ItemType Directory -Path $stateDir -Force | Out-Null
          $state = Join-Path $stateDir 'state.json'
          @'
          {
            "profiles": [
              { "name": "work", "label": "Work", "icon": "W", "configDir": "$HOME/.claude-work" },
              { "name": "personal", "label": "Personal", "icon": "P", "configDir": "$HOME/.claude-personal" }
            ],
            "projects": [
              { "name": "demo", "path": "C:\\demo" },
              { "name": "other", "path": "C:\\other" }
            ]
          }
          '@ | Set-Content $state -Encoding UTF8

          $env:CLAUDE_LAUNCHER_STATE = $state
          $dll = 'src/bin/Release/net8.0/ClaudeLauncher.dll'

          # Present at every size.
          # ASCII-only needles: the workflow file is asserted as ASCII, and the
          # box-drawing and bullet glyphs the screens use would break that.
          $always = @('Select a Claude profile', 'Your intelligent CLI companion', 'Andrew Nguyen - chuongnd2612', 'Projects', 'New profile', 'Appearance', 'Running sessions', 'Stop session', 'Terminals', 'Focus', 'Zoom', 'Layout')
          # The launch summary and the tips box are intentionally dropped when the
          # window is too short, so only require them on roomy terminals.
          $tall = @('Launch summary', 'Tips', 'Opens in')

          foreach ($size in @(@(80, 24), @(100, 30), @(132, 44), @(200, 60))) {
            # -join matters: with an array on the left, -notmatch filters instead
            # of returning a boolean, so every check would "fail".
            $out = (dotnet $dll --selftest $size[0] $size[1]) -join "`n"
            if ($LASTEXITCODE -ne 0) { throw "selftest exited with $LASTEXITCODE at $($size[0])x$($size[1])" }

            $expected = $always
            if ($size[1] -ge 40) { $expected += $tall }

            foreach ($needle in $expected) {
              if ($out -notmatch [regex]::Escape($needle)) {
                throw "selftest at $($size[0])x$($size[1]) is missing: $needle"
              }
            }
          }

          Write-Host 'All screens rendered at every size.'

      - name: Verify the wrapper parses and keeps its UTF-8 BOM
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'scripts/claude-launcher.ps1'

          $bytes = [System.IO.File]::ReadAllBytes($path)
          if ($bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) {
            throw "$path lost its UTF-8 BOM; PowerShell 5.1 would mangle the box-drawing characters."
          }

          # The opposite rule for the scripts users pipe into iex: irm passes a
          # BOM through as a literal U+FEFF character, which stops param() from
          # being the first statement.
          foreach ($remote in @('install-online.ps1', 'uninstall.ps1')) {
            $bytes = [System.IO.File]::ReadAllBytes($remote)
            if ($bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
              throw "$remote must be UTF-8 without a BOM, or 'irm | iex' fails with Unexpected attribute 'CmdletBinding'."
            }

            $nonAscii = @($bytes | Where-Object { $_ -gt 127 })
            if ($nonAscii.Count -gt 0) {
              throw "$remote has $($nonAscii.Count) non-ASCII byte(s); it must stay ASCII so it never needs a BOM."
            }

            # Parse it the way `irm | iex` does: as a string, not a file.
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseInput(
              [System.Text.Encoding]::UTF8.GetString($bytes), [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Host $_.Message -ForegroundColor Red }
              throw "$remote does not parse as a string; 'irm | iex' would fail."
            }

            # $PSCmdlet is null when the body runs as a bare script block, so a
            # direct call silently aborts the script on its first use.
            $direct = Select-String -Path $remote -Pattern '\$PSCmdlet\.' -AllMatches
            if ($direct) {
              $direct | ForEach-Object { Write-Host "$remote line $($_.LineNumber): $($_.Line.Trim())" -ForegroundColor Red }
              throw "$remote calls `$PSCmdlet directly; it is null under 'irm | iex'. Route it through a helper that falls back."
            }
          }

          # Parse under Windows PowerShell 5.1 specifically - that is the oldest
          # host we support, and it rejects PS7-only syntax.
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_.Message -ForegroundColor Red }
            throw "$path has $($errors.Count) parse error(s)."
          }

          foreach ($script in @('install.ps1', 'install-online.ps1', 'uninstall.ps1', 'scripts/publish-standalone.ps1', 'packaging/install.ps1')) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Host $_.Message -ForegroundColor Red }
              throw "$script has $($errors.Count) parse error(s)."
            }
          }

          Write-Host 'PowerShell scripts parse cleanly on 5.1.'

      - name: Verify the Windows Terminal command lines
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          # Dot-sourcing only defines functions; nothing launches.
          . .\scripts\claude-launcher.ps1

          if ((ConvertTo-ClaudeLauncherPSLiteral "it's") -ne "'it''s'") { throw 'PS literal escaping is wrong' }
          if ((ConvertTo-ClaudeLauncherWtPath 'C:\demo\') -ne 'C:\demo') { throw 'trailing backslash must be trimmed' }
          if ((ConvertTo-ClaudeLauncherWtPath 'C:\') -ne 'C:\') { throw 'a drive root keeps its backslash' }

          $env:CLAUDE_LAUNCHER_WT_DRYRUN = '1'
          $result = [pscustomobject]@{
            profile = 'work'; label = 'Work'; icon = 'W'
            configDir = 'C:\Users\test\.claude-work'
            project = 'demo'; path = 'C:\My Projects\app'; mode = 'resume'
          }

          $stub = New-ClaudeLauncherPaneScript -Result $result -ExtraArgs @()
          $body = Get-Content $stub -Raw
          foreach ($needle in @("CLAUDE_CONFIG_DIR = 'C:\Users\test\.claude-work'",
                                "Set-Location -LiteralPath 'C:\My Projects\app'",
                                '--resume')) {
            if ($body -notmatch [regex]::Escape($needle)) { throw "pane stub is missing: $needle" }
          }

          # A path with spaces has to stay ONE argument, which is why these are
          # built as an array and splatted rather than joined into a string.
          foreach ($case in @(@{ o = 'tab'; verb = 'new-tab' },
                              @{ o = 'right'; verb = 'split-pane'; axis = '-V' },
                              @{ o = 'down'; verb = 'split-pane'; axis = '-H' })) {
            $wtArgs = Start-ClaudeLauncherPane -Result $result -PaneScript $stub -OpenIn $case.o
            if ($wtArgs[0] -ne '-w') { throw "$($case.o): the window target must come first" }
            if ($wtArgs -notcontains $case.verb) { throw "$($case.o): expected $($case.verb)" }
            if ($case.axis -and ($wtArgs -notcontains $case.axis)) { throw "$($case.o): expected $($case.axis)" }
            $d = [array]::IndexOf($wtArgs, '-d')
            if ($wtArgs[$d + 1] -ne 'C:\My Projects\app') { throw "$($case.o): the project path was split or altered" }
          }

          Remove-Item $stub -Force -ErrorAction SilentlyContinue
          Write-Host 'Windows Terminal command lines are well formed.'
